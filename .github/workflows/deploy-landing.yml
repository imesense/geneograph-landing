# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "Deploy landing"

on:
    push:
        branches:
            - "default"
        paths:
            - ".github/workflows/**"
            - "src/**"
            - "*.html"
            - "*.css"
            - "*.js"

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

defaults:
    run:
        shell: pwsh

jobs:
    build-landing:
        name: "Build landing"

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Build landing
              run: |
                  mkdir `
                      -p ${{ github.workspace }}/dist/
                  cp `
                      ${{ github.workspace }}/index.html `
                      ${{ github.workspace }}/dist/index.html
                  cp `
                      ${{ github.workspace }}/logo.svg `
                      ${{ github.workspace }}/dist/logo.svg

            - name: Upload landing
              id: deployment
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ${{ github.workspace }}/dist

    deploy-landing:
        name: "Deploy landing"

        needs:
            - build-landing

        strategy:
            matrix:
                system:
                    - ubuntu-24.04

        runs-on: ${{ matrix.system }}

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy landing
              id: deployment
              uses: actions/deploy-pages@v5
